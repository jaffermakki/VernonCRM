## Render Blueprint for TechPro+ CRM
##
## Deploy: push this repo to GitHub, then in the Render dashboard choose
## "New +" -> "Blueprint" and point it at the repo. Render reads this
## file and provisions both services below in one go — no manual
## click-through setup needed.
##
## What this creates:
##   1. A web service running the FastAPI app (Starter plan, $7/mo)
##   2. A managed Postgres database (Basic-256mb plan, $6/mo) — point-in-time
##      recovery is included on all paid Render Postgres plans as of 2026,
##      so backups are covered from the cheapest tier, unlike Railway's
##      Hobby plan which gates backups to Pro.
##   3. DATABASE_URL is wired automatically from the database to the web
##      service — you never type a connection string by hand.
##   4. SESSION_SECRET and SETTINGS_ENCRYPTION_KEY are auto-generated,
##      unique, and never appear in this file or in git history.
##
## After first deploy: log in with PIN 1234 (the seeded Owner account)
## and change it immediately from the Staff page.

databases:
  - name: techpro-crm-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: techpro-crm
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: techpro-crm-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # NOTE: deliberately NOT using generateValue here — Render's
      # auto-generated value isn't guaranteed to be a valid Fernet key
      # (32 url-safe base64 bytes), and an invalid key means the app
      # silently falls back to storing SMTP/Twilio credentials
      # unencrypted rather than failing loudly. Generate a real one
      # yourself and paste it into the Render dashboard — see DEPLOY.md.
      - key: SETTINGS_ENCRYPTION_KEY
        sync: false
      # Optional — leave unset to disable. Get a free DSN at sentry.io if
      # you want error monitoring/alerts on crashes.
      - key: SENTRY_DSN
        sync: false
